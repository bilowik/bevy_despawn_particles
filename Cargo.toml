[package]
name = "bevy_despawn_particles"
version = "0.4.0"
edition = "2021"
license = "Unlicense"
keywords = ["gamedev", "graphics", "bevy", "bevy_plugin"]
categories = ["game-development"]
authors = ["bilowik"]
description = "An event-based plugin for Bevy to spawn particles on despawn that are built from the original texture"
repository = "https://github.com/bilowik/bevy_despawn_particles"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy_sprite = "0.17.0"     
bevy_pbr = "0.17.0"        
bevy_ecs = "0.17.0"        
bevy_math = "0.17.0"       
bevy_reflect = "0.17.0"    
bevy_time = "0.17.0"       
bevy_app = "0.17.0"        
bevy_render = "0.17.0"     
bevy_asset = "0.17.0"      
bevy_log = "0.17.0"        
bevy_transform = "0.17.0"
bevy_image = "0.17.0"
rand = "0.8.5"
bevy_rapier2d = { version = "0.30.0", optional = true }
bevy_variable_property = "0.4.0"
smallvec = { version = "1.11.0", features = ["const_generics"] }
thiserror = "1.0.43"
bevy_color = "0.17.0"
bevy_mesh = "0.17.0"
bevy_sprite_render = "0.17.0"
bevy_camera = "0.17.0"
bevy_shader = "0.17.0"

[features]
bevy_rapier2d = ["dep:bevy_rapier2d"]


[dev-dependencies]
bevy = "0.17.0"
